name: Build

# Typecheck, test, pack and validate the plugin. Called by ci.yml and
# release.yml; never triggered on its own.
on:
  workflow_call:
    inputs:
      upload:
        description: Upload the plugin and Bun package as run artifacts
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    # The job runs repository scripts (bun install, bun run test); keep the
    # token they can reach read-only regardless of the caller's grant.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # tools/test-backend runs backend/main.lua with Millennium stubbed.
      - name: Install test runtimes
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit libwayland-client0

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tools/gen-build-identity.test.ts

      # Lua backend + notify-action seams (notify-send/gdbus shimmed), and
      # the frontend's toast decode + click chooser, compiled offline.
      - run: bun run test
      - run: bun test tools/publication-policy.test.ts tools/release-notes.test.ts tools/verify-release-source.test.ts
      - run: bun run build:standalone
      - run: bun run test:standalone
      # Validate the exact Bun package users install, without embedding a runtime.
      - run: bun tools/build-release.ts
      - run: bun tools/test-packaged.ts

      # -o overrides millennium.toml's output_path=auto, which would install
      # into $HOME/.local/share/millennium/plugins; the file is <dir>/<id>.star
      # and starlight does not create <dir>.
      - name: Pack
        run: mkdir -p dist && ./node_modules/.bin/starlight pack -o dist

      # A green pack still proves nothing about the running client (see
      # AGENTS.md), but a red one blocks a broken bundle.
      - name: Validate the .star
        run: |
          star=dist/me.tysmith.steam-native-notifications.star
          test -f "$star" || { echo "no .star produced"; exit 1; }
          size=$(stat -c%s "$star")
          echo "packed: $star ($size bytes)"
          # The healthy bundle is ~44KB; a near-empty pack means the frontend
          # or an asset silently fell out of the bundle.
          test "$size" -gt 20000 || { echo ".star suspiciously small"; exit 1; }
          head -c 16 "$star" | grep -aq MILLENNIUM || { echo "no MILLENNIUM shim header"; exit 1; }
          # Parses the header and checks every section's CRC32.
          ./node_modules/.bin/starlight verify "$star"

      # archive: false keeps the artifact a bare .star, installable as downloaded.
      - if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/me.tysmith.steam-native-notifications.star
          archive: false
          if-no-files-found: error

      - if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: standalone-bun-package
          path: |
            dist/releases/*.tgz
            dist/releases/*.tgz.sha256
          if-no-files-found: error
