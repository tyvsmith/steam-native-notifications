name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload: ${{ github.event_name == 'push' }}

  # Every green push to main republishes both integrations under one fixed
  # pre-release, so there is always one download URL for the newest build:
  #   https://github.com/tyvsmith/steam-native-notifications/releases/download/latest/me.tysmith.steam-native-notifications.star
  # The `latest` tag moves to the merge commit and the asset is replaced in
  # place; the release record itself is kept, so watchers are not notified
  # for every push. Numbered releases stay in release.yml.
  latest:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: me.tysmith.steam-native-notifications.star
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: standalone-bun-package
          path: standalone

      - name: Prepare the standalone download
        working-directory: standalone
        run: |
          packages=(snn-*.tgz)
          test "${#packages[@]}" -eq 1
          sha256sum --check "${packages[0]}.sha256"
          cp "${packages[0]}" ../dist/steam-native-notifications.tgz
          cd ../dist
          sha256sum steam-native-notifications.tgz > steam-native-notifications.tgz.sha256

      - name: Move the latest tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=repos/${{ github.repository }}/git/refs/tags/latest
          if gh api "$ref" >/dev/null 2>&1; then
            gh api -X PATCH "$ref" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Publish both integrations under the latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          star=dist/me.tysmith.steam-native-notifications.star
          test -f "$star" || { echo "artifact missing"; ls -R dist; exit 1; }
          manifest=$(gh api "repos/${{ github.repository }}/contents/millennium.toml?ref=$GITHUB_SHA" --jq .content | base64 -d | awk -F'"' '/^\[/{s=$0} s=="[plugin]" && /^version *=/{print $2}')
          notes="Rolling build of \`main\` at ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%dT%H:%MZ)). The bundle claims version $manifest. Replaced on every green push; for a fixed version use a numbered release."
          notes="$notes

          - Millennium: download the .star plugin
          - Standalone: download steam-native-notifications.tgz and its SHA-256 checksum; Linux x64 supported, Windows x64 preview
          - Install or update with Bun 1.4.3+: bun add --global --force --trust ./steam-native-notifications.tgz
          - Restart Steam after installation; see https://github.com/${{ github.repository }}/blob/$GITHUB_SHA/docs/install.md for prerequisites and checksum verification"
          assets=("$star" dist/steam-native-notifications.tgz dist/steam-native-notifications.tgz.sha256)
          if gh release view latest -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest "${assets[@]}" --clobber -R "${{ github.repository }}"
            gh release edit latest --prerelease --title "Latest build" --notes "$notes" -R "${{ github.repository }}"
          else
            gh release create latest "${assets[@]}" --prerelease --title "Latest build" --notes "$notes" --verify-tag -R "${{ github.repository }}"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Verify the published Bun download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloaded
          gh release download latest -R "${{ github.repository }}" --pattern 'steam-native-notifications.tgz*' --dir downloaded
          cmp dist/steam-native-notifications.tgz downloaded/steam-native-notifications.tgz
          cd downloaded
          sha256sum --check steam-native-notifications.tgz.sha256
          export BUN_INSTALL="$RUNNER_TEMP/snn-release-smoke"
          bun add --global --ignore-scripts "$PWD/steam-native-notifications.tgz"
          "$BUN_INSTALL/bin/snn" --help
