name: Windows standalone
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build:standalone
      - run: bun test standalone/windows.test.ts standalone/windows-diagnostics.test.ts shared/settings-policy.test.ts shared/contracts.test.ts
      - shell: powershell
        run: ./tools/test-windows-notify-action.ps1 -Offline
      - shell: powershell
        run: ./tools/test-game-focus.ps1
