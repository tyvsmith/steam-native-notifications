name: Windows standalone
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build:standalone
      - name: Exercise Windows process and pipe lifecycles
        run: |
          foreach ($iteration in 1..10) {
            bun test standalone/windows.test.ts standalone/windows-diagnostics.test.ts standalone/dependencies.test.ts shared/settings-policy.test.ts shared/contracts.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            bun test standalone/windows-acl.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - shell: powershell
        run: ./tools/test-windows-notify-action.ps1 -Offline
      - shell: powershell
        run: ./tools/test-game-focus.ps1
